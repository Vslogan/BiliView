name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '版本标签（如 v0.8.0）；留空则构建当前 ref'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          VERSION=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          cp app/build/outputs/apk/debug/app-debug.apk "BiliView-${VERSION}-debug.apk"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: BiliView ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            更新内容：
            - 修复 MP3 导出报错：java-lame 双声道模式未正确设置导致的初始化失败；编码质量提升至 LAME 最高档（-q 0）。
            - MP3 导出支持选择码率：自动匹配源码率（推荐）或 128/192/256/320 kbps，选择时实时预测文件大小。
            - 修复 MP3 导出报错（LAME MPEGMode 空指针），改用稳定质量参数。
            - 修复缓存列表可能一直显示「分析中…」的问题：媒体信息改为点「分析」手动触发，已分析的条目显示「详细」，详细弹窗内可「重新分析」。
            - 本地转换新增音频导出：可只导出音轨为 M4A（直接复制）、MP3（320kbps）或 WAV（无损 PCM），忽略视频文件。
            - 缓存列表展示每条视频的真实媒体参数（分辨率、平均帧率、码率、音频采样率与声道等），异步分析并以实测为准，分析结果按 MD5 缓存复用；点「详细」查看全部参数。
            - 同步上游 0.7.2：新增「用户查询」，可通过 UID 查看账号粉丝与关注情况，并通过 aicu 查询评论、视频弹幕和直播弹幕的历史记录。
            - 导出格式可选 MP4 或 MKV（MKV 封装不重新编码，保留原始画质）。
            - 弹幕四种处理：关闭 / 烧录进画面 / 导出同名 ASS 字幕文件 / 内嵌 ASS 字幕轨（MKV，可在播放器中开关）。
            - 链接下载、合集、收藏夹与本地缓存转换共用同一组导出选项。

            APK 使用调试签名打包；覆盖安装其他签名来源的版本前请先卸载。
          files: BiliView-*-debug.apk
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
